services:
  - type: web
    name: crazy-uno
    runtime: node
    plan: free
    # deploy a new commit on main only after the GitHub checks (.github/workflows/ci.yml) pass
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render sits behind Cloudflare: Cloudflare puts the player's address in cf-connecting-ip (overwriting
      # whatever the browser sent); X-Forwarded-For gets two entries appended (Cloudflare, then Render's balancer)
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY
        value: "2"
