    <!-- the launch splash: drawn by the browser before any script runs, so the app never opens on a blank screen -->
    <style>
      html, body { margin: 0; height: 100%; background: #b81d16; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 42%, #ffb347 0%, #f26b1d 28%, #c8231a 62%, #6e0a0e 100%);
        font-family: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif; color: #fff;
        transition: opacity 0.45s ease, visibility 0.45s; -webkit-user-select: none; user-select: none;
      }
      #splash.sp-gone { opacity: 0; visibility: hidden; }
      .sp-cards { position: relative; width: 150px; height: 112px; margin-bottom: 10px; }
      .sp-cards i {
        position: absolute; left: 50%; bottom: 0; width: 62px; height: 92px; margin-left: -31px; border-radius: 10px;
        border: 4px solid #fffdf6; box-shadow: 0 10px 20px rgba(60, 0, 0, 0.35); transform-origin: 50% 150%;
        animation: sp-fan 1.6s cubic-bezier(.45, 0, .2, 1) infinite;
      }
      .sp-cards i::before {
        content: ""; position: absolute; left: 50%; top: 50%; width: 34px; height: 64px; margin: -32px 0 0 -17px;
        border-radius: 50%; background: #fffdf6; transform: rotate(24deg);
      }
      .sp-cards i:nth-child(1) { background: #2f6fde; --c: #2f6fde; --r: -22deg; animation-delay: 0s; }
      .sp-cards i:nth-child(2) { background: #f5b800; --c: #d99a00; --r: 0deg; animation-delay: 0.08s; }
      .sp-cards i:nth-child(3) { background: #e5413a; --c: #e5413a; --r: 22deg; animation-delay: 0.16s; }
      .sp-cards i::after {
        content: "UNO"; position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-24deg);
        font-weight: 900; font-size: 15px; color: var(--c); letter-spacing: -0.02em;
      }
      @keyframes sp-fan {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        35%, 70% { transform: rotate(var(--r)) translateY(-6px); }
      }
      .sp-title { display: flex; flex-direction: column; align-items: center; line-height: 0.95; text-shadow: 0 3px 0 rgba(90, 0, 0, 0.35); }
      .sp-title small { font-size: 15px; font-weight: 900; letter-spacing: 0.14em; opacity: 0.95; }
      .sp-title b { font-size: 54px; font-weight: 900; letter-spacing: -0.03em; transform: rotate(-4deg); text-shadow: 0 4px 0 #c41a10, 0 7px 0 #7a0a04; }
      .sp-bar { width: 132px; height: 6px; border-radius: 999px; background: rgba(0, 0, 0, 0.22); overflow: hidden; }
      .sp-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #ffd84a; animation: sp-bar 1.1s ease-in-out infinite; }
      @keyframes sp-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (orientation: landscape) and (max-height: 520px) { #splash { gap: 14px; } .sp-title b { font-size: 44px; } }
      @media (prefers-reduced-motion: reduce) { .sp-cards i { animation: none; transform: rotate(var(--r)); } .sp-bar span { animation: none; width: 100%; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Rubik:wght@400;500;700&display=swap" />

  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-cards"><i></i><i></i><i></i></div>
      <div class="sp-title"><small id="sp-top">CRAZY</small><b>UNO</b></div>
      <div class="sp-bar"><span></span></div>
    </div>
    <script>
      // the splash and the tab title in the player's language, before the app loads (same choice as src/i18n)
      (function () {
        var l = null;
        try { l = localStorage.getItem('crazy-uno-lang'); } catch (e) {}
        if (l !== 'ru' && l !== 'en' && l !== 'pl') {
          l = 'en';
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < list.length; i++) {
            var c = String(list[i]).toLowerCase().split(/[-_]/)[0];
            if (c === 'ru' || c === 'uk' || c === 'be') { l = 'ru'; break; }
            if (c === 'pl') { l = 'pl'; break; }
            if (c === 'en') break;
          }
        }
        var top = { en: 'CRAZY', ru: '\u0411\u0415\u0417\u0423\u041c\u041d\u041e\u0415', pl: 'SZALONE' }[l];
        document.documentElement.lang = l;
        document.title = top.charAt(0) + top.slice(1).toLowerCase() + ' UNO';
        document.getElementById('sp-top').textContent = top;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
